[workspace]
members = [
    "agent_runtime",
    "agent_bootstrap",
    "credential_envelope",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
gosh-agent-runtime = { path = "agent_runtime" }
hkdf = "0.13"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
